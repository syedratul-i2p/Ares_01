<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0a; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ARES-01 Rover Mission Control</title>
    <meta name="description" content="ARES-01 Rover Mission Control — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ARES-01 Rover Mission Control" />
    <meta property="og:description" content="ARES-01 Rover Mission Control — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARES-01 Rover Mission Control" />
    <meta name="twitter:description" content="ARES-01 Rover Mission Control — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #0a0a0a; margin: 0; padding: 0; overflow-x: hidden; touch-action: manipulation;">
    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:red;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerHTML = '<h2>CRASH DETECTED</h2>' + 
          '<p><strong>Message:</strong> ' + msg + '</p>' +
          '<p><strong>URL:</strong> ' + url + '</p>' +
          '<p><strong>Line:</strong> ' + lineNo + ':' + columnNo + '</p>' +
          '<p><strong>Stack:</strong><br/>' + (error && error.stack ? error.stack : 'No stack trace') + '</p>';
        document.body.appendChild(errDiv);
        return false;
      };
      window.onunhandledrejection = function (event) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:red;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerHTML = '<h2>UNHANDLED PROMISE REJECTION</h2>' +
          '<p><strong>Reason:</strong> ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</p>';
        document.body.appendChild(errDiv);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
